<!DOCTYPE html>

  if ("serviceWorker" in navigator) {
    addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

<body>
<!-- 시작 화면: 스크립트를 받기 전에 바로 보이도록 HTML에 직접 (게임이 준비되면 사라짐) -->
<div id="opening" class="boot"><img class="opblur" src="img/opening_4.webp" alt=""><img class="opening" src="img/opening_4.webp" alt=""><div class="op-fade"></div>
  <div class="op-bottom"><div class="logo2"><div class="k">BANCASSURANCE QUIZ RPG</div><h1>방카BM <em>성장기</em></h1><p>인턴에서 사장까지, 지식으로 승진하라!</p></div>
  <div class="op-load"><div class="spin"></div>출근 준비 중…</div></div></div>
<div id="app">
  <div id="stage"><div id="bg"></div><div id="chara"></div></div>
  <header id="hud" class="hidden"></header>
  <div id="sesshud" class="sess-hud hidden"></div>
  <div id="screen"></div>
  <div id="vn">
    <div id="place"></div>
    <div id="choices"></div>
    <div id="dialog">
      <div class="nametag"></div>
      <div class="meta"></div>
      <div class="text"></div>
      <div class="next">▼</div>
      <div class="timer"><i></i></div>
    </div>
  </div>
  <nav id="nav" class="hidden">
    <button data-go="home"><span>🏢</span>오늘 일정</button>
    <button data-go="study"><span>📚</span>학습회</button>
    <button data-go="rank"><span>🏆</span>RANK</button>
    <button data-go="shop"><span>🛒</span>매점</button>
    <button data-go="char"><span>🧑‍💼</span>내 캐릭터</button>
    <button data-go="settings"><span>⚙️</span>설정</button>
  </nav>
  <div id="fx"></div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>
