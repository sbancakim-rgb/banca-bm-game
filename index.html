<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방카BM 성장기</title>
<meta name="description" content="방카슈랑스·경제 지식 퀴즈로 인턴에서 사장까지 성장하는 방카BM 육성 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=32">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff6f91" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1724" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="방카BM">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<script>
  if ("serviceWorker" in navigator) {
    addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>
<div id="app">
  <div id="stage"><div id="bg"></div><div id="chara"></div></div>
  <header id="hud" class="hidden"></header>
  <div id="sesshud" class="sess-hud hidden"></div>
  <div id="screen"></div>
  <div id="vn">
    <div id="place"></div>
    <div id="choices"></div>
    <div id="dialog">
      <div class="nametag"></div>
      <div class="meta"></div>
      <div class="text"></div>
      <div class="next">▼</div>
      <div class="timer"><i></i></div>
    </div>
  </div>
  <nav id="nav" class="hidden">
    <button data-go="home"><span>🏢</span>오늘 일정</button>
    <button data-go="study"><span>📚</span>학습회</button>
    <button data-go="shop"><span>🛒</span>매점</button>
    <button data-go="char"><span>🧑‍💼</span>내 캐릭터</button>
    <button data-go="settings"><span>⚙️</span>설정</button>
  </nav>
  <div id="fx"></div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>

<script src="js/env.js?v=32"></script>
<script src="js/art.js?v=32"></script>
<script src="js/config.js?v=32"></script>
<script src="js/data/library.js?v=32"></script>
<script src="js/sprites.js?v=32"></script>
<script src="js/store.js?v=32"></script>
<script src="js/api.js?v=32"></script>
<script src="js/game.js?v=32"></script>
</body>
</html>
